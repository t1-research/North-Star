<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — North Star Monitor</title>
<style>
  :root {
    --bg: #071820;
    --card: #0e2a3a;
    --border: rgba(255, 255, 255, 0.08);
    --teal: #14b8a6;
    --text: #e6f0f3;
    --muted: #8fb0bd;
    --bad: #f87171;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 32px 32px 28px;
    width: 100%; max-width: 360px;
    text-align: center;
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
  }
  .logo {
    width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 16px;
    background: linear-gradient(135deg, var(--teal), #0d9488);
    display: flex; align-items: center; justify-content: center;
    font-size: 27px; font-weight: 800; color: #04222b;
    box-shadow: 0 4px 18px rgba(20, 184, 166, 0.35);
  }
  h1 { font-size: 21px; font-weight: 800; letter-spacing: -0.5px; }
  h1 span { color: var(--teal); }
  p { color: var(--muted); font-size: 13px; margin: 6px 0 22px; }
  input {
    width: 100%; padding: 12px 14px; font-size: 16px; font-family: inherit;
    color: var(--text); background: #071820; border: 1px solid var(--border);
    border-radius: 10px; outline: none;
  }
  input:focus { border-color: var(--teal); }
  button {
    width: 100%; margin-top: 14px; padding: 12px; font-family: inherit;
    font-size: 15px; font-weight: 700; cursor: pointer; border: none;
    background: var(--teal); color: #04222b; border-radius: 10px;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(1.1); }
  button:disabled { opacity: 0.55; cursor: wait; }
  #error {
    display: none; margin-top: 14px; font-size: 13.5px; font-weight: 600;
    color: var(--bad); min-height: 18px;
  }

  /* Small phones: tighter card padding; the input stays 16px so iOS
     doesn't auto-zoom on focus, and the button is already full-width. */
  @media (max-width: 400px) {
    body { padding: 16px; }
    .card { padding: 24px 20px; }
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">&#9733;</div>
    <h1>North Star <span>Monitor</span></h1>
    <p>Sign in to view your home network.</p>
    <form id="login-form">
      <input type="password" id="password" placeholder="Password"
             autocomplete="current-password" autofocus>
      <button type="submit" id="submit">Sign in</button>
      <div id="error"></div>
    </form>
  </div>

<script>
'use strict';
const form = document.getElementById('login-form');
const password = document.getElementById('password');
const submit = document.getElementById('submit');
const error = document.getElementById('error');

function showError(msg) {
  error.textContent = msg;
  error.style.display = 'block';
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  error.style.display = 'none';
  submit.disabled = true;
  submit.textContent = 'Signing in…';
  try {
    const r = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: password.value }),
    });
    if (r.ok) {
      window.location.href = '/';
      return;
    }
    if (r.status === 401) showError('Wrong password');
    else if (r.status === 429) showError('Too many failed logins — try again in a few minutes');
    else showError('Something went wrong — try again');
  } catch (err) {
    showError('Could not reach the server');
  }
  submit.disabled = false;
  submit.textContent = 'Sign in';
  password.value = '';
  password.focus();
});
</script>
</body>
</html>
