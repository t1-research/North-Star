# North Star Monitor — configuration
# ⚠️ Do NOT edit this file on your PC. Your own settings go in
# config.local.yaml (copy config.local.yaml.example) — this file is tracked
# by git, and the launcher's auto-update pulls will fail if you've changed it.
# Everything here is LAN-only. Never port-forward this dashboard to the internet.

# Auto-updater (launcher.py only — ignored when running run.py directly).
# The launcher checks the remote every update_check_interval_seconds and
# pulls + restarts the monitor when a push lands. Set auto_update: false
# (in config.local.yaml) to supervise without updating.
auto_update: true
update_check_interval_seconds: 300  # 5 minutes
update_branch: "main"
update_remote: "origin"

# Web dashboard address. 0.0.0.0 = reachable from any device on your LAN
# (and over Tailscale from anywhere).
host: "0.0.0.0"
port: 8080

# Subnet to scan for devices (your Deco LAN).
subnet: "192.168.68.0/24"

# Collector intervals (seconds)
scan_interval_seconds: 120      # device scan (ping sweep + ARP)
latency_interval_seconds: 60    # latency probe
speedtest_interval_seconds: 900   # automatic speed test (every 15 min)
service_check_interval_seconds: 120  # down detector (HTTP health checks)

# Services to watch (the down detector). Each gets a HEAD request (no body
# downloaded; falls back to a 1 KiB GET when HEAD doesn't give a clean
# answer). A service is declared down after 2 consecutive failures, and
# recovers on the first success after that. When the internet itself is
# down, checks are skipped and every service shows as "unknown" instead of
# a pile of false outages.
# Each service may set its own interval_seconds (default: the global
# service_check_interval_seconds above). The Vercel sites are checked every
# 3 hours on purpose — checking them every 2 minutes would run up
# Vercel usage for no benefit.
services:
  - name: "T1 Research"
    url: "https://t1-research.vercel.app/"
    interval_seconds: 10800  # 3 hours — keep Vercel usage down
  - name: "Walton Press Co"
    url: "https://waltonpressco.vercel.app/"
    interval_seconds: 10800  # 3 hours — keep Vercel usage down
  - name: "Google"
    url: "https://www.google.com"
  - name: "GitHub"
    url: "https://github.com"
  - name: "Steam"
    url: "https://store.steampowered.com"
  - name: "Discord"
    url: "https://discord.com"
  - name: "YouTube"
    url: "https://www.youtube.com"
  - name: "Cloudflare"
    url: "https://www.cloudflare.com"

# Latency probe targets. External targets (public IPs) drive outage detection:
# an outage opens when ALL of them fail in the same probe round.
latency_targets:
  - "1.1.1.1"      # Cloudflare DNS (external)
  - "8.8.8.8"      # Google DNS (external)
  - "192.168.68.1" # Deco gateway (local)
  - "192.168.1.1"  # CAX30 modem/router (local)

# Known devices. Match by MAC (preferred — survives DHCP changes) or by IP.
#   name: label shown on the dashboard — a manual name ALWAYS wins over the
#         auto-discovered name (mDNS / NetBIOS / DNS / vendor), and manually
#         named devices aren't probed at all. Most devices name themselves
#         now, so only add entries to rename something or enable WoL — and
#         add them in config.local.yaml, not here (see the header note).
#   mac:  hardware address, e.g. "F8:3D:C6:9B:CA:5A"
#   ip:   static/fixed IP, e.g. "192.168.68.68"
#   wol:  true adds a Wake-on-LAN button. WoL needs the MAC address; if only an
#         IP is given here, the MAC is learned from the first ARP scan.
# These entries carry no names on purpose: the devices name themselves via
# auto-identification (NetBIOS gives the Windows computer name, mDNS the
# Apple device name). The entries exist only to enable WoL — a nameless
# entry is still probed, and its discovered name is what the dashboard
# shows. The Deco isn't listed (it's discovered like any other LAN device)
# and neither is the CAX30 (it's on another subnet, so it can't be
# discovered — but it's still pinged as a latency target).
devices:
  - mac: "F8:3D:C6:9B:CA:5A"
    wol: true
  - ip: "192.168.68.68"
    wol: true
